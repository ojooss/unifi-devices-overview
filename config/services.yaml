parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\UnifiApiClient:
        arguments:
            $baseUrl: '%env(UNIFI_BASE_URL)%'
            $apiKey: '%env(UNIFI_API_KEY)%'
            $site: '%env(UNIFI_SITE)%'
            $verifyTls: '%env(bool:UNIFI_VERIFY_TLS)%'

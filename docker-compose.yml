services:
  webserver:
    build: .
    restart: always
    environment:
      - APP_ENV=prod
      - APP_LOCALE=${APP_LOCALE:-en}
      - UNIFI_BASE_URL=${UNIFI_BASE_URL:-}
      - UNIFI_API_KEY=${UNIFI_API_KEY:-}
      - UNIFI_SITE=${UNIFI_SITE:-default}
      - UNIFI_VERIFY_TLS=${UNIFI_VERIFY_TLS:-true}
    volumes:
      - data:/var/www/html/var/data
    ports:
      - "8080:80"

volumes:
  data:
